name: MCM desktop bundles
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run desktop:build:${{ matrix.platform }}
      - run: npm run desktop:test
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb openbox x11-utils
          LIBGL_ALWAYS_SOFTWARE=1 MCM_DESKTOP_SMOKE=1 MCM_DATA_DIR="$PWD/test-results/native-window" MCM_PORT=19838 xvfb-run -a bash -c '
            openbox >/tmp/mcm-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid" EXIT
            dist/desktop/linux/MCM/MCM
          '
      - uses: actions/upload-artifact@v4
        with:
          name: MCM-${{ matrix.platform }}-x86_64
          path: dist/desktop/${{ matrix.platform }}/MCM/
          retention-days: 7
